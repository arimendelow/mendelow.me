name: Bootstrap (temporary)

# A one-off for the family pass: installs the dependencies and the Ouro HX items in CI (the local machine is busy),
# then builds and checks, and uploads the installed files for committing. Deleted before the pull request merges.
on:
  push:
    branches: [family-pass]
    paths: [.github/workflows/bootstrap.yml]

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          npm install astro@^5 @astrojs/react@^4 react@^19 react-dom@^19 tailwindcss@^4 @tailwindcss/vite@^4
          npm install -D typescript@^5.9 @types/react@^19 @types/react-dom@^19 node-html-parser playwright axe-core
      - name: Add the Ouro HX items at v1.3.7
        run: npx -y shadcn@latest add --yes --overwrite ourostack/ouro-ui/ouro-base#v1.3.7 ourostack/ouro-ui/button#v1.3.7 ourostack/ouro-ui/link#v1.3.7 ourostack/ouro-ui/item#v1.3.7 ourostack/ouro-ui/skip-link#v1.3.7 ourostack/ouro-ui/navbar#v1.3.7 ourostack/ouro-ui/color-scheme-toggle#v1.3.7 ourostack/ouro-ui/lib-scroll-fade#v1.3.7 ourostack/ouro-ui/ouro-check#v1.3.7 2>&1 | tee bootstrap-shadcn.log
      - name: Show what changed
        run: git status --short && git diff -- src/styles/global.css components.json | tee bootstrap-diff.log
      - name: Type check
        continue-on-error: true
        run: npx tsc --noEmit 2>&1 | tee bootstrap-tsc.log
      - name: Fade check
        continue-on-error: true
        run: node scripts/check-fades.mjs 2>&1 | tee bootstrap-fades.log
      - name: Build
        continue-on-error: true
        run: node scripts/build-site.mjs _site 2>&1 | tee bootstrap-build.log
      - name: Page checks
        continue-on-error: true
        run: node scripts/check-hx.mjs _site 2>&1 | tee bootstrap-hx.log
      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap
          include-hidden-files: true
          path: |
            package.json
            package-lock.json
            components.json
            src/
            bootstrap-*.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bootstrap-site
          path: _site
          if-no-files-found: ignore
