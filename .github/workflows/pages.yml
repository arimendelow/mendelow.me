name: Pages

# Builds the site (Astro, rendering Ouro HX on the server; the social card is generated from the built page), checks
# it, and deploys master to GitHub Pages. Pull requests run every check without deploying, so a red check blocks
# the merge. Requires Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Runs not triggered by a pull request each
# get their own group, so they are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the family links against ourostack/.github brand/family.json
        run: node --test 'tests/*.test.mjs'
      - name: Type check
        run: npx tsc --noEmit
      - name: Build, generate the social card and check share metadata
        run: node scripts/build-site.mjs _site
      - name: Check the page's structure (Ouro UI, the Ouro list, the family links, Ouro HX controls, no text caps)
        run: node scripts/check-hx.mjs _site
      - name: Install Chromium for the screen check
        run: npx playwright install --with-deps chromium
      # Ouro check at a phone, a laptop and 4K, light and dark: layout, pictures, type scale, headings, motion, loading
      # and presses. It exits 3 on any finding, so a finding fails this job and blocks the merge.
      - name: Ouro check at 390, 1440 and 3840 wide, light and dark
        run: node lib/ouro/check/check.ts _site --sizes 390x844,1440x900,3840x2160 --out ouro-check
      - name: Check that no picture fades (Ouro check's fade check, over the source)
        run: node scripts/check-fades.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ouro-check
          path: ouro-check
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: social-card
          path: _site/assets/social-card.png
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    # One Pages deploy at a time. A running deploy is never cancelled; a waiting one may be replaced by
    # a newer push, so the newest commit always deploys.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
