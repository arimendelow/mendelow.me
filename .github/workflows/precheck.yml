name: Pre-check (temporary)

# Runs the Ouro check from ouro-ui main (what v1.3.10 will ship) on this build before the tag exists. Deleted before
# the pull request.
on:
  push:
    branches: [ouro-v1.3.10]

permissions:
  contents: read

jobs:
  precheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/build-site.mjs _site
      - name: Ouro check from ouro-ui main, at the gate's sizes
        run: |
          for f in check design-check fade-check fades in-page measure motion-check overlap-check serve size-check; do
            curl -fsSL "https://raw.githubusercontent.com/ourostack/ouro-ui/e33f226ce8fce8e250795964915254fb0bb4d83f/registry/ouro/check/$f.ts" -o "lib/ouro/check/$f.ts"
          done
          node lib/ouro/check/check.ts _site --sizes 390x844,1440x900,3840x2160 --out ouro-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ouro-check
          path: ouro-check
