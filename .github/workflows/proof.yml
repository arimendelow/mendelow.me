name: Proof (temporary)

# Round two's before and after screenshots and the showcase being played with, shot in CI. Deleted before merge.
on:
  push:
    branches: [showcase]

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Before (the live site)
        run: node .github/proof/shoot.mjs before https://mendelow.me/ proof/before
      - name: Build
        run: node scripts/build-site.mjs _site
      - name: After (this branch)
        run: node .github/proof/shoot.mjs after _site proof/after play
      - name: Recordings as GIFs
        if: always()
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          for f in proof/after/play-*.webm; do
            [ -f "$f" ] || continue
            ffmpeg -loglevel error -y -i "$f" -vf "fps=12,scale=720:-1:flags=lanczos,split[a][b];[a]palettegen=stats_mode=diff[p];[b][p]paletteuse=dither=bayer:bayer_scale=4" "${f%.webm}.gif"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proof
          path: proof
