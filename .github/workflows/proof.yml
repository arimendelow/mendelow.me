name: Proof (temporary)

# Before and after crops for the Ouro check fixes, and the new check at the gate's three sizes. Deleted before merge.
on:
  push:
    branches: [check-fixes]

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build
        run: node scripts/build-site.mjs _site
      - name: Before (the live site)
        run: node .github/proof/fixes.mjs before https://mendelow.me/ proof/before
      - name: After (this branch)
        run: node .github/proof/fixes.mjs after _site proof/after
      - name: The new Ouro check (ouro-ui#803, merged, not yet released), at the gate's sizes
        continue-on-error: true
        run: |
          for f in check design-check fade-check fades in-page measure motion-check overlap-check serve size-check; do
            curl -fsSL "https://raw.githubusercontent.com/ourostack/ouro-ui/c7ed66833577e7c7683cfbeaa3191ebb780db7f8/registry/ouro/check/$f.ts" -o "lib/ouro/check/$f.ts"
          done
          node lib/ouro/check/check.ts _site --sizes 390x844,1440x900,3840x2160 --out proof/ouro-check 2>&1 | tail -40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proof
          path: proof
