name: Proof (temporary)

# Before (live) and after (this branch) of the Spoonjoy card. Deleted before merge.
on:
  push:
    branches: [spoonjoy-polish]

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/build-site.mjs _site
      - run: node .github/proof/spoonjoy.mjs https://mendelow.me/ proof/before
      - run: node .github/proof/spoonjoy.mjs _site proof/after
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proof
          path: proof
