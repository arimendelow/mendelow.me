name: Proof (temporary)

# Round two's before and after screenshots and the showcase being played with, shot in CI. Deleted before merge.
on:
  push:
    branches: [showcase-4]

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Before (the live site)
        run: node .github/proof/shoot.mjs before https://mendelow.me/ proof/before
      - name: Build
        run: node scripts/build-site.mjs _site
      - name: After (this branch)
        run: node .github/proof/shoot.mjs after _site proof/after play
      - name: The new Ouro check (ouro-ui#803, merged, not yet released), on this build only
        continue-on-error: true
        run: |
          # The registry is built at release, so take the check's own files from the merge commit.
          for f in check design-check fade-check fades in-page measure motion-check overlap-check serve size-check; do
            curl -fsSL "https://raw.githubusercontent.com/ourostack/ouro-ui/c7ed66833577e7c7683cfbeaa3191ebb780db7f8/registry/ouro/check/$f.ts" -o "lib/ouro/check/$f.ts"
          done
          node lib/ouro/check/check.ts _site --out proof/ouro-check-803 2>&1 | tail -40
      - name: Recordings as GIFs
        if: always()
        timeout-minutes: 6
        continue-on-error: true
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null
          for f in proof/after/play-*.webm; do
            [ -f "$f" ] || continue
            case "$f" in *phone*) w=300; r=10 ;; *) w=720; r=12 ;; esac
            ffmpeg -loglevel error -y -i "$f" -vf "fps=$r,scale=$w:-1:flags=lanczos,split[a][b];[a]palettegen=stats_mode=diff[p];[b][p]paletteuse=dither=bayer:bayer_scale=4" "${f%.webm}.gif"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proof
          path: proof
