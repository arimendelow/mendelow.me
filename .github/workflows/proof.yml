name: Proof (temporary)

# Before and after screenshots for the family pass pull request, shot in CI because the local machine is busy.
# Deleted before the pull request merges.
on:
  push:
    branches: [family-pass]

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Before (the live site)
        run: node .github/proof/shoot.mjs before https://mendelow.me/ proof/before
      - name: Build
        run: node scripts/build-site.mjs _site
      - name: After (this branch)
        run: MENUS=1 node .github/proof/shoot.mjs after _site proof/after
      - name: Ouro check
        continue-on-error: true
        run: node lib/ouro/check/check.ts _site --out proof/ouro-check 2>&1 | tail -80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proof
          path: proof
