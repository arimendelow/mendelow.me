name: Add Ouro HX items (temporary)

# Adds the showcase's Ouro HX items at the site's release tag in CI (local installs fail on the proxy) and uploads
# the result for committing. Deleted before the pull request merges.
on:
  push:
    branches: [showcase-2]
    paths: [.github/workflows/upgrade.yml]

permissions:
  contents: read

jobs:
  add:
    runs-on: ubuntu-latest
    env:
      TAG: v1.3.9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Add the items at the tag
        run: |
          items=""
          for item in reaction-bar; do items="$items ourostack/ouro-ui/$item#$TAG"; done
          npx -y shadcn@latest add --yes --overwrite $items 2>&1 | tee upgrade-shadcn.log
      - run: git status --short | tee upgrade-status.log; git --no-pager diff --stat | tee -a upgrade-status.log; git --no-pager diff package.json | tee -a upgrade-status.log
      - uses: actions/upload-artifact@v4
        with:
          name: upgrade
          include-hidden-files: true
          path: |
            package.json
            package-lock.json
            components.json
            src/
            lib/
            upgrade-*.log
