name: Upgrade Ouro HX (temporary)

# A one-off for the family pass: moves every installed Ouro HX item to one release tag in CI (the local machine is
# busy) and uploads the result for committing. Deleted before the pull request merges.
on:
  push:
    branches: [ouro-hx-v1.3.9]
    paths: [.github/workflows/upgrade.yml]

permissions:
  contents: read

jobs:
  upgrade:
    runs-on: ubuntu-latest
    env:
      TAG: v1.3.9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Add every item at the tag
        run: |
          items=""
          for item in ouro-base button link item item-group skip-link navbar color-scheme-toggle lib-scroll-fade ouro-check family-bar family-footer; do items="$items ourostack/ouro-ui/$item#$TAG"; done
          npx -y shadcn@latest add --yes --overwrite $items 2>&1 | tee upgrade-shadcn.log
      - run: git status --short | tee upgrade-status.log; git --no-pager diff --stat | tee -a upgrade-status.log
      - uses: actions/upload-artifact@v4
        with:
          name: upgrade
          include-hidden-files: true
          path: |
            package.json
            package-lock.json
            components.json
            src/
            lib/
            upgrade-*.log
