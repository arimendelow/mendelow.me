<link rel="stylesheet" href="/styles.css">
<script>
  // Flag JS, and apply a saved theme before first paint so there is no flash.
  document.documentElement.classList.add("js");
  try { var t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>

      <a class="sister-link" href="https://ouroboros.bot">How I build with agents<span aria-hidden="true">&nbsp;&#8599;</span></a>
    </nav>
    <div class="header-actions">
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to dark theme" title="Light or dark">
        <svg class="theme-icon-sun" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path stroke-linecap="round" d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="theme-icon-moon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linejoin="round" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
      <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Toggle menu" aria-expanded="false" aria-controls="site-nav">
        <svg class="menu-icon-open" width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16"/></svg>
        <svg class="menu-icon-close" width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"/></svg>

<script>
  // Theme toggle, as on ouroboros.bot: the system theme by default, and a
  // remembered override. The <head> script applies a saved choice before paint.
  (function () {
    var button = document.getElementById('theme-toggle');
    if (!button) return;
    var root = document.documentElement;
    function current() {
      return root.dataset.theme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    }
    function label() { button.setAttribute('aria-label', current() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'); }
    label();
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', label);
    button.addEventListener('click', function () {
      var next = current() === 'dark' ? 'light' : 'dark';
      root.dataset.theme = next;
      try { localStorage.setItem('theme', next); } catch (e) {}
      label();
    });
  })();
  // Nav glass: the header is glass by default (so it stays readable without JS)
  // and turns clear only while the page sits at the very top.
  (function () {
    var header = document.getElementById('site-header');
    if (!header) return;
    function update() { header.classList.toggle('at-top', window.scrollY < 1); }
    window.addEventListener('scroll', update, { passive: true });
    update();

    // Mobile menu. Without JS the links simply wrap in the header.
    var toggle = document.getElementById('menu-toggle');
    if (!toggle) return;
    var outside = [document.getElementById('main'), document.querySelector('.site-footer'), document.querySelector('.skip-link')];
    function isOpen() { return header.classList.contains('menu-open'); }
    function setOpen(open) {
      header.classList.toggle('menu-open', open);
      toggle.setAttribute('aria-expanded', String(open));
      document.body.style.overflow = open ? 'hidden' : '';
      // While the sheet covers the page, keep keyboard focus inside the header.
      outside.forEach(function (el) { if (el) el.inert = open; });
    }
    toggle.addEventListener('click', function () { setOpen(!isOpen()); });
    header.querySelectorAll('.site-nav a').forEach(function (a) { a.addEventListener('click', function () { setOpen(false); }); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && isOpen()) { setOpen(false); toggle.focus(); }
    });
    window.matchMedia('(min-width: 960px)').addEventListener('change', function () { if (isOpen()) setOpen(false); });
  })();
</script>
</body>
</html>
